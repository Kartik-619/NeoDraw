name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Add permission for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Not 20 to avoid deprecation
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0  # Matches your packageManager field
          run_install: false
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run type checking
        run: pnpm run check-types
      
      - name: Run linting
        run: pnpm run lint
      
      - name: Build all apps
        run: pnpm run build
      
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/neodraw-frontend/out  # Next.js static export
        # If you're not doing static export, change to:
        # path: apps/neodraw-frontend/.next
  
  # Only deploy if we're on main/master branch
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4